<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>SABOTASK — BUILD BOARD</title>
<style>
@font-face{font-family:'BM';src:url('https://media.base44.com/files/public/6a8b7346981ed7c96b9784cf/fb5b65fa4_break_marker-webfont.woff') format('woff');font-display:swap}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#14081F;font-family:'BM','Segoe Print','Comic Sans MS',cursive,sans-serif;color:#fff;position:fixed;inset:0;height:100%;overflow:hidden;padding:14px 16px 14px;padding-top:calc(14px + env(safe-area-inset-top,0px))}
header{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:16px}
h1{font-size:21px;letter-spacing:1px;color:#9FE838;text-shadow:2px 2px 0 #E8158C}
#status{font-size:12px;opacity:.75;letter-spacing:.5px}
#refresh{margin-left:auto;background:#E8158C;color:#14081F;border:0;font-family:inherit;font-size:13px;letter-spacing:1px;padding:8px 16px;border-radius:9px;cursor:pointer;transform:rotate(-1.2deg);box-shadow:3px 3px 0 #000}
#refresh:active{transform:rotate(-1.2deg) scale(.96)}
#menu{max-width:560px;height:100%;overflow-y:auto;-webkit-overflow-scrolling:touch}
.hint{font-size:11px;opacity:.55;margin-bottom:12px;letter-spacing:.5px}
.menucard{background:#221040;border:2px solid rgba(255,255,255,.09);border-radius:14px;padding:18px;margin-bottom:14px;cursor:pointer;display:flex;align-items:center;gap:12px;box-shadow:4px 4px 0 rgba(0,0,0,.45)}
.menucard:active{transform:scale(.985)}
.menucard .nm{font-size:16px;letter-spacing:.8px}
.menucard .arrow{margin-left:auto;color:#9FE838;font-size:14px;letter-spacing:1px}
.badge{font-size:11px;background:#00D4E8;color:#14081F;border-radius:7px;padding:3px 8px;transform:rotate(-2deg)}
.menucard.openlink{background:#1d0e38}
.menucard.openlink .arrow{color:#00D4E8}
#viewer{position:fixed;inset:0;background:#000;display:none;z-index:40}
#viewer.on{display:block}
#stage{position:absolute;background:#000;overflow:hidden}
#stage iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#000}
#island{position:absolute;inset:0;pointer-events:none;display:none}
#island.on{display:block}
#island img{width:100%;height:100%;display:block}
.iz{position:absolute;border:2px dashed rgba(255,65,161,.9);background:rgba(255,65,161,.13);border-radius:6px}
.iz.pill{border-radius:999px;background:rgba(0,0,0,.55)}
.iz.corner{background:transparent}
.iz span{position:absolute;left:0;right:0;top:100%;margin-top:2px;text-align:center;font-family:'Segoe Print',cursive;font-size:9px;letter-spacing:.5px;color:#ff9db4;white-space:nowrap}
/* ---- control dock: OUTSIDE the stage, at the bottom ---- */
#dock{display:none;position:fixed;left:0;right:0;bottom:0;z-index:50;background:rgba(20,8,31,.97);border-top:2px solid #CCFF00;padding:8px 10px calc(8px + env(safe-area-inset-bottom,0px));flex-direction:column;gap:8px}
#viewer.on #dock{display:flex}
.drow{display:flex;gap:8px;align-items:center}
.dchip{flex:0 0 auto;background:#221040;border:1px solid rgba(255,255,255,.28);color:#fff;font-family:inherit;font-size:12px;letter-spacing:1px;padding:10px 14px;border-radius:10px;cursor:pointer;box-shadow:2px 2px 0 rgba(0,0,0,.5)}
.dchip:active{transform:scale(.95)}
#tuneChip.on{background:#ff00ff;border-color:#ff00ff;font-weight:700}
#islandChip.off{opacity:.55}
#tunerow{display:none}
#tunerow.on{display:flex}
#selrow{display:none;flex-wrap:wrap}
#selrow.on{display:flex}
#selrow .dchip{padding:8px 10px;font-size:11px}
#selname{font:11px monospace;color:#00D4E8;letter-spacing:.5px;padding:2px 4px}
#tpush{background:#CCFF00;color:#14081F;font-weight:700}
#tstatus{flex:1;min-width:0;font:10px/1.3 monospace;color:#9FE838;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
/* ---- LIST menu: full-screen picker ---- */
#listmenu{position:fixed;top:calc(8px + env(safe-area-inset-top,0px));right:8px;width:min(52vw,320px);background:rgba(20,8,31,.92);border:2px solid #ff00ff;border-radius:14px;z-index:80;display:none;flex-direction:column;padding:10px;box-shadow:3px 3px 0 rgba(0,0,0,.5)}
#listmenu.on{display:flex}
.lmhead{display:flex;align-items:center;gap:6px;margin-bottom:8px}
.lmhead h2{font-size:13px;letter-spacing:.5px;color:#9FE838;text-shadow:1px 1px 0 #E8158C}
.lmhead .dchip{margin-left:auto;font-size:11px;padding:7px 10px}
#lmrows{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
.lrow{background:#221040;border:2px solid rgba(255,255,255,.09);border-radius:10px;padding:10px 12px;margin-bottom:8px;cursor:pointer;display:flex;align-items:center;gap:8px;box-shadow:2px 2px 0 rgba(0,0,0,.45)}
.lrow:active{transform:scale(.97)}
.lrow .did{font-size:13px;letter-spacing:.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}
.lrow .dd{font:10px monospace;color:#9FE838;flex-shrink:0}
.lrow.sel{background:#ff00ff;border-color:#ff00ff}
.lrow.sel .did,.lrow.sel .dd{color:#14081F;font-weight:700}
.lrow.kit{border-color:#00D4E8;background:#123c4a}
.lrow.kit .did{color:#00D4E8}
.lrow.kit.sel{background:#ff00ff;border-color:#ff00ff}
.lrow.kit.sel .did{color:#14081F}
.lrow.part{opacity:.55}
footer{margin-top:22px;font-size:10px;opacity:.4;letter-spacing:.5px}
</style>
</head>
<body>
<header>
  <h1>SABOTASK BUILD BOARD</h1>
  <span id="status">booting…</span>
  <button id="refresh" onclick="refresh()">REFRESH</button>
</header>
<div id="menu"></div>
<div id="viewer">
  <div id="stage"><iframe id="vframe" title="screen"></iframe><div id="island"></div></div>
  <div id="dock">
    <div class="drow">
      <button class="dchip" id="backChip" onclick="backToMenu()">◂ BOARD</button>
      <button class="dchip" id="tuneChip" onclick="toggleTune()">TUNE</button>
      <button class="dchip" id="islandChip" onclick="toggleIsland()">ISLAND</button>
      <button class="dchip" id="refChip" onclick="refresh()">↻</button>
    </div>
    <div class="drow" id="tunerow">
      <button class="dchip" id="tlistbtn" onclick="tapList()">LIST</button>
      <button class="dchip" id="tpush" onclick="pushDeltas()">PUSH</button>
      <button class="dchip" id="treset" onclick="resetDeltas()">RESET</button>
      <span id="tstatus"></span>
    </div>
    <div class="drow" id="selrow">
      <span id="selname"></span>
      <button class="dchip" onclick="bumpS(-0.05)">SIZE −</button>
      <button class="dchip" onclick="bumpS(0.05)">SIZE +</button>
      <button class="dchip" onclick="bumpR(-5)">ROT −</button>
      <button class="dchip" onclick="bumpR(5)">ROT +</button>
      <button class="dchip" onclick="bumpZ(1)">▲ FWD</button>
      <button class="dchip" onclick="bumpZ(-1)">▼ BACK</button>
      <button class="dchip" onclick="clearSel()">CLR</button>
    </div>
  </div>
</div>
<div id="listmenu">
  <div class="lmhead"><h2>PICK ONE</h2><button class="dchip" style="margin-left:auto" onclick="closeList()">✕ DONE</button></div>
  <div id="lmrows"></div>
</div>
<footer>tap a screen — it opens at true device scale · all controls live OUTSIDE the screen in the dock · island overlay shows the real device no-go zones · refresh is MANUAL, tap REFRESH or ↻ when you want the newest build</footer>
<script>
var MAN='https://zevie-6b9784cf.base44.app/functions/saboBoardManifest';
var PUSH_URL='https://zevie-6b9784cf.base44.app/functions/saboSeatTuner';
var store={get:function(k){try{return localStorage.getItem(k)}catch(e){return null}},set:function(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
var last=null, current=null, overlayURL=null, islandOn=store.get('saboIsland')==='1';

function status(t){document.getElementById('status').textContent=t}

/* ---------- island overlay ---------- */
function islandChip(){var c=document.getElementById('islandChip');c.textContent='ISLAND: '+(islandOn?'ON':'OFF');c.className='dchip'+(islandOn?'':' off')}
function toggleIsland(){islandOn=!islandOn;store.set('saboIsland',islandOn?'1':'0');islandChip();applyIsland()}
function applyIsland(){var el=document.getElementById('island');el.className=islandOn?'on':''}
function buildIsland(){
  var el=document.getElementById('island');el.innerHTML='';
  if(overlayURL){el.innerHTML='<img src="'+overlayURL+'" alt="island grid overlay">';return}
  el.innerHTML=
   '<div class="iz pill" style="left:34.1%;top:.45%;width:31.9%;height:4.4%"><span>THE ISLAND — NO INK</span></div>'
  +'<div class="iz" style="left:9.5%;top:1.2%;width:17.5%;height:3%"><span>APPLE CLOCK</span></div>'
  +'<div class="iz" style="left:81%;top:1.2%;width:15%;height:3%"><span>BATTERY</span></div>'
  +'<div class="iz corner" style="left:0;top:0;width:14%;height:6.5%;border-top-color:transparent;border-left-color:transparent;border-radius:0 0 100% 0"></div>'
  +'<div class="iz corner" style="right:0;top:0;width:14%;height:6.5%;border-top-color:transparent;border-right-color:transparent;border-radius:0 0 0 100%"></div>';
}

/* ---------- stage fit: letterbox ABOVE the dock ---------- */
function fit(){
  var vw=window.innerWidth,vh=(window.visualViewport?window.visualViewport.height:window.innerHeight);
  var dockH=0;
  var dk=document.getElementById('dock');
  var viewerOn=document.getElementById('viewer').className.indexOf('on')>=0;
  if(viewerOn&&dk&&dk.offsetWidth)dockH=dk.offsetHeight;
  var s=Math.min(vw/1080,Math.max(0,vh-dockH)/2340);
  var w=1080*s,h=2340*s;
  var st=document.getElementById('stage');
  st.style.width=w+'px';st.style.height=h+'px';
  st.style.left=(vw-w)/2+'px';
  st.style.top=Math.max(0,(vh-dockH-h)/2)+'px';
}
window.addEventListener('resize',fit);

/* ---------- tune engine (board-side, reaches INTO the srcdoc iframe — same origin) ---------- */
var SCREENKEY={solo:'solo_choice',duo:'duo_choice',monitor:'monitor'};
var EXCLUDE={app:1,wrap:1,bg:1,flash:1,shake:1,gate:1};
var KIT_ID='fusekit';
var KIT_MEMBERS=['flamewrap','line','trail'];
var KIT={flamewrap:1,line:1,trail:1,bob:1,flame:1};
function memberIds(id){return id===KIT_ID?KIT_MEMBERS:[id]}
var tuneOn=false, SEL=null, BOOST=[], D={}, BASE={}, ZB={}, drag=null;

function fdoc(){try{return document.getElementById('vframe').contentDocument}catch(e){return null}}
function fbody(){var d=fdoc();return d?d.body:null}
function fapp(){var d=fdoc();return d?d.getElementById('app'):null}
function tkey(){var k=current?current.id:'';if(SCREENKEY[k])k=SCREENKEY[k];return 'tuneseats_'+k}
function tsave(){try{localStorage.setItem(tkey(),JSON.stringify(D))}catch(e){}}
function tload(){try{D=JSON.parse(localStorage.getItem(tkey())||'{}')}catch(e){D={}}}
function tscale(){var a=fapp();return (a&&a.getBoundingClientRect().width/1080)||1}
function tstatus(t){document.getElementById('tstatus').textContent=t}
function baseOf(el){var id=el.id;if(!(id in BASE)){var t=fdoc().defaultView.getComputedStyle(el).transform;BASE[id]=(t&&t!=='none')?t:'none'}return BASE[id]}
function dval(id){var v=D[id];if(!v)v={};if(v.s===undefined)v.s=1;if(v.r===undefined)v.r=0;if(v.z===undefined)v.z=0;if(v.dx===undefined)v.dx=0;if(v.dy===undefined)v.dy=0;return v}
function zbaseOf(el){var id=el.id;if(!(id in ZB)){var z=parseInt(fdoc().defaultView.getComputedStyle(el).zIndex,10);ZB[id]=isNaN(z)?0:z}return ZB[id]}
function kitApply(v){var d=fdoc();KIT_MEMBERS.forEach(function(one){var el=d&&d.getElementById(one);if(!el)return;
  el.style.setProperty('translate',v.dx+'px '+v.dy+'px','important');
  if(v.s!==1)el.style.setProperty('scale',String(v.s),'important');
  if(v.r)el.style.setProperty('rotate',v.r+'deg','important');
  if(v.z)el.style.setProperty('z-index',String((KIT_ID===SEL&&tuneOn?2147483000:zbaseOf(el))+v.z),'important');
})}
function applyOne(id){var d=fdoc();if(id===KIT_ID){if(D[id])kitApply(dval(id));return}
  var el=d&&d.getElementById(id);if(!el||!D[id])return;var b=baseOf(el);var v=dval(id);
  var t=(b==='none'?'':b+' ')+'translate('+v.dx+'px,'+v.dy+'px)';
  if(v.s!==1)t+=' scale('+v.s+')';
  if(v.r)t+=' rotate('+v.r+'deg)';
  el.style.setProperty('transform',t,'important');
  if(v.z)el.style.setProperty('z-index',String((id===SEL&&tuneOn?2147483000:zbaseOf(el))+v.z),'important');
}
function applyAll(){Object.keys(D).forEach(applyOne)}

function injectTuneStyle(){var d=fdoc();if(!d)return;
  var st=d.createElement('style');st.id='boardtune';
  st.textContent='.tuning #app [id]{outline:2px dashed #CCFF00!important;outline-offset:-2px;cursor:grab!important;touch-action:none;user-select:none}'
   +'.tuning #app [id].tsel{outline:3px solid #ff00ff!important;box-shadow:0 0 0 4px rgba(255,0,255,.35)!important}'
   +'.tuning.selactive #app [id]:not(.tsel){outline:none!important}';
  d.head.appendChild(st);
}
function attachDrag(){var d=fdoc();if(!d)return;
  d.addEventListener('pointerdown',function(e){
    if(!tuneOn)return;
    var el,id;
    if(SEL){id=SEL;el=d.getElementById(id);if(!el&&id!==KIT_ID)return}
    else{el=(e.target&&e.target.closest)?e.target.closest('#app [id]'):null;if(!el||EXCLUDE[el.id])return;id=el.id;
      if(KIT[el.id]){id=KIT_ID;el=null}}
    e.preventDefault();e.stopPropagation();
    var v=dval(id);if(el)baseOf(el);
    drag={el:el,id:id,bx:v.dx,by:v.dy,sx:e.clientX,sy:e.clientY};
    try{if(el)el.setPointerCapture(e.pointerId)}catch(x){}
  },true);
  d.addEventListener('pointermove',function(e){
    if(!drag)return;var s=tscale();
    var v=dval(drag.id);
    v.dx=Math.round(drag.bx+(e.clientX-drag.sx)/s);v.dy=Math.round(drag.by+(e.clientY-drag.sy)/s);
    D[drag.id]=v;applyOne(drag.id);
  },true);
  var end=function(){if(drag){drag=null;tsave();selUI()}};
  d.addEventListener('pointerup',end,true);
  d.addEventListener('pointercancel',end,true);
}
function unselect(){var d=fdoc();var was=SEL;if(was&&d){memberIds(was).forEach(function(one){var p=d.getElementById(one);if(p){p.classList.remove('tsel');p.style.removeProperty('opacity');p.style.removeProperty('z-index');if(was===KIT_ID){p.style.removeProperty('translate');p.style.removeProperty('scale');p.style.removeProperty('rotate')}}});if(D[was])applyOne(was)}SEL=null;var b=fbody();if(b)b.classList.remove('selactive');selUI()}
function selectEl(id){var d=fdoc();if(!d)return;
  if(SEL===id){unselect();tstatus('released — direct drag active');return}
  unselect();
  SEL=id;
  memberIds(id).forEach(function(one){var el=d.getElementById(one);if(el){el.classList.add('tsel');el.style.setProperty('opacity','1','important');el.style.setProperty('z-index','2147483000','important');BOOST.push(one)}});
  var b=fbody();if(b)b.classList.add('selactive');
  tstatus(id===KIT_ID?'FUSE KIT — flame + both lines move as one':'moving ONLY '+id+' — drag anywhere · SIZE/ROT/LAYER in dock');
  selUI();
}
function selUI(){
  var row=document.getElementById('selrow'),nm=document.getElementById('selname');
  if(tuneOn&&SEL){row.className='drow on';var v=dval(SEL);nm.textContent=(SEL===KIT_ID?'FUSE KIT':SEL)+' · '+(SEL!==KIT_ID&&v.s!==1?Math.round(v.s*100)+'% ':'')+(SEL!==KIT_ID&&v.r?v.r+'° ':'')+(v.z?'L'+(v.z>0?'+':'')+v.z+' ':'')+v.dx+','+v.dy}
  else{row.className='drow';nm.textContent=''}
  fit();
}
function toggleTune(){
  tuneOn=!tuneOn;
  var c=document.getElementById('tuneChip');c.className='dchip'+(tuneOn?' on':'');
  document.getElementById('tunerow').className='drow'+(tuneOn?' on':'');
  var b=fbody();if(b)b.classList.toggle('tuning',tuneOn);
  if(!tuneOn){unselect();tstatus('')}
  else{tstatus('drag dashed things · grab the fuse — KIT moves as one · PUSH sends to Nigella')}
  selUI();
}

/* ---------- size + rotation steppers ---------- */
function bumpS(v){
  if(!SEL){tstatus('pick something from LIST first');return}
  if(SEL===KIT_ID){tstatus('FUSE KIT moves as one — resize is a canon change, tell Nigella');return}
  var d2=dval(SEL);d2.s=Math.round((d2.s+v)*1000)/1000;
  if(d2.s<0.2)d2.s=0.2;if(d2.s>3)d2.s=3;
  D[SEL]=d2;applyOne(SEL);tsave();selUI();
}
function bumpR(v){
  if(!SEL){tstatus('pick something from LIST first');return}
  if(SEL===KIT_ID){tstatus('FUSE KIT moves as one — rotation is a canon change, tell Nigella');return}
  var d2=dval(SEL);d2.r=(d2.r||0)+v;
  D[SEL]=d2;applyOne(SEL);tsave();selUI();
}
function bumpZ(v){
  if(!SEL){tstatus('pick something from LIST first');return}
  var d2=dval(SEL);d2.z=(d2.z||0)+v;
  D[SEL]=d2;applyOne(SEL);tsave();selUI();
  tstatus('layer '+(d2.z>0?'+':'')+d2.z+' — tap its row again to see it land in the stack');
}
function clearSel(){
  if(!SEL){tstatus('nothing picked');return}
  var d=fdoc();
  memberIds(SEL).forEach(function(one){var el=d&&d.getElementById(one);if(el){el.style.removeProperty('transform');el.style.removeProperty('translate');el.style.removeProperty('scale');el.style.removeProperty('rotate');el.style.removeProperty('z-index')}});
  if(SEL in BASE)delete BASE[SEL];
  delete D[SEL];tsave();selUI();
  tstatus((SEL===KIT_ID?'FUSE KIT':SEL)+' back to canon');
}

/* ---------- LIST menu ---------- */
function closeList(){document.getElementById('listmenu').className=''}
function renderList(){
  var d=fdoc();var app=fapp();
  if(!d||!app)return false;
  var seen={},ids=[];
  app.querySelectorAll('[id]').forEach(function(el){if(!EXCLUDE[el.id]&&!seen[el.id]){seen[el.id]=1;ids.push(el.id)}});
  var rows=document.getElementById('lmrows');rows.innerHTML='';
  var kv=D[KIT_ID];
  var kdd=kv?((kv.z?'L'+(kv.z>0?'+':'')+kv.z+' ':'')+((kv.dx>=0?'+':'')+kv.dx+','+(kv.dy>=0?'+':'')+kv.dy)):'·';
  var kr=document.createElement('div');kr.className='lrow kit'+(SEL===KIT_ID?' sel':'');
  kr.innerHTML='<span class="did">FUSE KIT — flame + both lines</span><span class="dd">'+kdd+'</span>';
  kr.onclick=function(){selectEl(KIT_ID);renderList()};
  rows.appendChild(kr);
  ids.forEach(function(id){
    var v=D[id];
    if(KIT[id]){var pr=document.createElement('div');pr.className='lrow part';
      pr.innerHTML='<span class="did">'+id+'</span><span class="dd">→ KIT</span>';
      pr.onclick=function(){selectEl(KIT_ID);renderList();tstatus('part of the FUSE KIT — the trio moves as one')};
      rows.appendChild(pr);return}
    var r=document.createElement('div');r.className='lrow'+(SEL===id?' sel':'');
    var dd=v?((v.s!==undefined&&v.s!==1)?Math.round(v.s*100)+'% ':'')+(v.r?v.r+'° ':'')+(v.z?'L'+(v.z>0?'+':'')+v.z+' ':'')+((v.dx>=0?'+':'')+v.dx+','+(v.dy>=0?'+':'')+v.dy):'·';
    r.innerHTML='<span class="did">'+id+'</span><span class="dd">'+dd+'</span>';
    r.onclick=function(){selectEl(id);renderList()};
    rows.appendChild(r);
  });
  return true;
}
function tapList(){
  var lm=document.getElementById('listmenu');
  if(lm.className==='on'){closeList();return}
  if(!renderList()){tstatus('screen still loading…');return}
  var dk=document.getElementById('dock');
  var vh=(window.visualViewport?window.visualViewport.height:window.innerHeight);
  lm.style.maxHeight=Math.max(200,vh-(dk?dk.offsetHeight:0)-24)+'px';
  lm.className='on';
  tstatus('screen stays live — pick away, ✕ when done');
}

/* ---------- PUSH / RESET ---------- */
function pushDeltas(){
  if(!current){tstatus('open a screen first');return}
  var sc=SCREENKEY[current.id]||current.id;
  var payload={screen:sc,deltas:Object.keys(D).map(function(k){var v=dval(k);return{id:k,dx:v.dx,dy:v.dy,s:v.s,r:v.r,z:v.z}})};
  if(!payload.deltas.length){tstatus('nothing to push yet');return}
  var txt=JSON.stringify(payload);
  try{if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(txt)}catch(x){}
  tstatus('sending…');
  fetch(PUSH_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:txt})
    .then(function(r){return r.json()})
    .then(function(j){tstatus(j&&j.ok?'SENT — tell Nigella to PULL':'server hiccup — payload copied, paste it to Nigella in chat')})
    .catch(function(){tstatus('offline — payload copied, paste it to Nigella in chat')});
}
function resetDeltas(){
  var d=fdoc();
  Object.keys(D).forEach(function(id){memberIds(id).forEach(function(one){var el=d&&d.getElementById(one);if(el){el.style.removeProperty('transform');el.style.removeProperty('translate');el.style.removeProperty('scale');el.style.removeProperty('rotate');el.style.removeProperty('z-index')}});delete BASE[id]});
  BOOST.forEach(function(id){var el=d&&d.getElementById(id);if(el){el.classList.remove('tsel');el.style.removeProperty('opacity');el.style.removeProperty('z-index')}});
  BOOST=[];unselect();D={};tsave();tstatus('back to canon seats');
}

/* ---------- demo load + readiness ---------- */
var loadTimer=null;
function watchDemo(){
  if(loadTimer)clearInterval(loadTimer);
  var tries=0;
  loadTimer=setInterval(function(){
    var d=fdoc();
    if(d&&d.readyState==='complete'&&fapp()){clearInterval(loadTimer);loadTimer=null;onDemoReady()}
    else if(++tries>60){clearInterval(loadTimer);loadTimer=null}
  },100);
}
function onDemoReady(){
  BASE={};ZB={};SEL=null;BOOST=[];
  injectTuneStyle();attachDrag();applyAll();
  var b=fbody();
  if(b)b.classList.toggle('tuning',tuneOn);
  selUI();
  if(tuneOn)tstatus('tune live — drag dashed things');
  else if(Object.keys(D).length)status('stored tune deltas applied · '+Object.keys(D).length+' moved');
}

/* ---------- viewer ---------- */
function openViewer(d){
  current=d;
  tload();
  document.getElementById('viewer').className='on';
  fit();
  var fr=document.getElementById('vframe');
  fr.srcdoc='<!DOCTYPE html><html><body style="background:#000;color:#fff;font-family:sans-serif;display:flex;align-items:center;justify-content:center;height:100vh;margin:0">loading…</body></html>';
  fetch(d.url).then(function(r){return r.text()}).then(function(html){
    if(current===d){fr.srcdoc=html;watchDemo()}
  }).catch(function(e){
    fr.srcdoc='<!DOCTYPE html><html><body style="background:#3a0d18;color:#ff9db4;font-family:sans-serif;display:flex;align-items:center;justify-content:center;height:100vh;margin:0;text-align:center;padding:20px">FETCH FAILED — screen unreachable:<br>'+(e&&e.message||e)+'</body></html>';
  });
}
function backToMenu(){
  tsave();
  current=null;
  document.getElementById('viewer').className='';
  closeList();
}

/* ---------- menu + manifest (MANUAL refresh only) ---------- */
function renderMenu(m){
  overlayURL=m.overlay&&m.overlay.url||null;
  buildIsland();islandChip();applyIsland();
  var g=document.getElementById('menu');g.innerHTML='';
  var hint=document.createElement('p');hint.className='hint';
  hint.textContent='tap a screen — controls + tune live in the dock OUTSIDE the screen'+(overlayURL?' · island grid: your PNG':' · island overlay: built-in zones');
  g.appendChild(hint);
  m.demos.forEach(function(d){
    var c=document.createElement('div');
    if(d.kind==='link'){
      c.className='menucard openlink';
      c.innerHTML='<span class="nm">'+d.name+'</span><a class="arrow" style="text-decoration:none" href="'+d.url+'" target="_blank" rel="noopener">OPEN IN TAB →</a>';
    }else{
      c.className='menucard';
      c.innerHTML='<span class="nm">'+d.name+'</span><span class="badge">'+d.sub+'</span><span class="arrow">OPEN →</span>';
      c.onclick=function(){openViewer(d)};
    }
    g.appendChild(c);
  });
}
function refresh(){
  status('refreshing…');
  fetch(MAN).then(function(r){return r.json()}).then(function(m){
    last=JSON.stringify(m);
    renderMenu(m);
    if(current){
      var fr=document.getElementById('vframe');
      fetch(current.url).then(function(r){return r.text()}).then(function(html){if(current){fr.srcdoc=html;watchDemo()}}).catch(function(){});
    }
    status('build v'+m.board_version+' · manual — tap REFRESH for newest');
  }).catch(function(){status('manifest unreachable — tap REFRESH')});
}

/* keep deltas alive against demo re-animating elements */
setInterval(function(){if(current&&Object.keys(D).length)applyAll()},700);

fit();islandChip();applyIsland();buildIsland();
refresh();
</script>
</body>
</html>
